# Builds every pull request and deploys it to a temporary Firebase preview URL,
# so Ian can open the real thing on his phone before merging.
#
# Originally generated by the Firebase CLI; adapted for this project. Kept at its
# original filename (renaming an existing file is a STOP condition).
#
# What was added to the generated version:
#   - a validation gate ahead of the build
#   - a pinned Node version with an npm cache
#
# The `if` on the job is from the generated file and is worth keeping: a pull
# request opened from a fork must not get access to the deploy secret.

name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- gate: nothing below runs if the data is bad ---------------------
      - name: Validate scholarship data
        run: python3 scripts/validate.py

      - name: Test the validator itself
        run: python3 scripts/test_validate.py

      - name: Check the English and Spanish files agree
        run: python3 scripts/check_i18n.py

      # --- build ------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # --- deploy to a preview channel --------------------------------------
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCHOLARSHIP_SITE_FD70F }}
          projectId: scholarship-site-fd70f

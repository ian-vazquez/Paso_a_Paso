# Production deploy. Runs only when something lands on main.
#
# Originally generated by the Firebase CLI; adapted for this project. Kept at
# its original filename (CLAUDE.md section 3 calls it deploy.yml — renaming an
# existing file is a STOP condition, so the name stays until Ian says otherwise).
#
# What was added to the generated version:
#   - a validation gate ahead of the build, so bad data can never deploy
#   - a pinned Node version with an npm cache, so builds are reproducible
#   - an explicit least-privilege `permissions` block
#
# The secret name below is the one the Firebase CLI created; it is not the
# FIREBASE_SERVICE_ACCOUNT name used in CLAUDE.md. See Checkpoint 1.

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- gate: nothing below runs if the data is bad ---------------------
      - name: Validate scholarship data
        run: python3 scripts/validate.py

      - name: Test the validator itself
        run: python3 scripts/test_validate.py

      # --- build ------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # --- deploy -----------------------------------------------------------
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCHOLARSHIP_SITE_FD70F }}
          channelId: live
          projectId: scholarship-site-fd70f
